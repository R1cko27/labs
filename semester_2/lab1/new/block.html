<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор блок-схем</title>
</head>
<body>
    <h1>Редактор блок-схем</h1>
    
    <div style="margin-bottom: 10px;">
        <button onclick="addBlock()">➕ Добавить блок</button>
        <button onclick="deleteSelected()">🗑️ Удалить выбранный</button>
        <button onclick="increaseSize()">📏 Увеличить размер</button>
        <button onclick="decreaseSize()">📏 Уменьшить размер</button>
        <button onclick="clearAll()">🔄 Очистить всё</button>
    </div>
    
    <div style="margin-bottom: 10px;">
        <span>Режим: </span>
        <select id="modeSelect">
            <option value="select">Выделение</option>
            <option value="add">Добавление блока</option>
            <option value="resize">Изменение размера</option>
        </select>
        
        <span style="margin-left: 20px;">Цвет: </span>
        <input type="color" id="blockColor" value="#87CEEB">
        
        <span style="margin-left: 20px;">Текст блока: </span>
        <input type="text" id="blockText" placeholder="Введите текст" value="Блок">
        <button onclick="updateSelectedText()">Применить текст</button>
    </div>
    
    <div style="border: 2px solid #333; position: relative; width: 1000px; height: 600px; background: #f0f0f0; overflow: hidden;" id="canvas">
        <!-- Блоки будут добавляться сюда -->
    </div>
    
    <p style="color: #666; margin-top: 10px;">
        <small>Инструкция: выберите режим "Выделение" для перемещения блоков. 
        Для изменения текста - выделите блок, введите текст и нажмите "Применить текст".</small>
    </p>

    <script>
        let blocks = [];
        let selectedBlock = null;
        let isDragging = false;
        let dragOffsetX, dragOffsetY;
        let isResizing = false;
        let resizeDirection = null;
        
        const canvas = document.getElementById('canvas');
        
        // Класс блока
        class Block {
            constructor(x, y, width = 120, height = 60, text = 'Блок', color = '#87CEEB') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.text = text;
                this.color = color;
                this.id = Date.now() + Math.random();
            }
            
            // Проверка, попадает ли точка в блок
            containsPoint(px, py) {
                return px >= this.x && px <= this.x + this.width && 
                       py >= this.y && py <= this.y + this.height;
            }
            
            // Проверка, попадает ли точка в область изменения размера (углы)
            getResizeDirection(px, py) {
                const margin = 10;
                if (px >= this.x + this.width - margin && px <= this.x + this.width + margin &&
                    py >= this.y + this.height - margin && py <= this.y + this.height + margin) {
                    return 'se';
                }
                return null;
            }
            
            // Отрисовка блока
            draw(ctx) {
                // Основной прямоугольник
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = this === selectedBlock ? '#ff0000' : '#000';
                ctx.lineWidth = this === selectedBlock ? 3 : 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                // Текст
                ctx.fillStyle = '#000';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Разбиваем текст на строки, если он длинный
                const words = this.text.split(' ');
                let lines = [];
                let currentLine = words[0];
                
                for (let i = 1; i < words.length; i++) {
                    const testLine = currentLine + ' ' + words[i];
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width < this.width - 10) {
                        currentLine = testLine;
                    } else {
                        lines.push(currentLine);
                        currentLine = words[i];
                    }
                }
                lines.push(currentLine);
                
                // Рисуем текст построчно
                const lineHeight = 20;
                const startY = this.y + (this.height - lines.length * lineHeight) / 2;
                
                lines.forEach((line, index) => {
                    ctx.fillText(line, this.x + this.width / 2, startY + index * lineHeight);
                });
                
                // Рисуем маркер изменения размера для выбранного блока
                if (this === selectedBlock) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(this.x + this.width - 10, this.y + this.height - 10, 10, 10);
                }
            }
        }
        
        // Перерисовка всех блоков
        function render() {
            // Очищаем canvas
            while (canvas.firstChild) {
                canvas.removeChild(canvas.firstChild);
            }
            
            // Создаем canvas для каждого блока
            blocks.forEach(block => {
                const blockCanvas = document.createElement('canvas');
                blockCanvas.width = canvas.clientWidth;
                blockCanvas.height = canvas.clientHeight;
                blockCanvas.style.position = 'absolute';
                blockCanvas.style.top = '0';
                blockCanvas.style.left = '0';
                blockCanvas.style.pointerEvents = 'none';
                
                const ctx = blockCanvas.getContext('2d');
                block.draw(ctx);
                
                canvas.appendChild(blockCanvas);
            });
        }
        
        // Добавление нового блока
        function addBlock() {
            const x = Math.random() * (canvas.clientWidth - 150) + 25;
            const y = Math.random() * (canvas.clientHeight - 100) + 25;
            const color = document.getElementById('blockColor').value;
            const text = document.getElementById('blockText').value;
            
            const block = new Block(x, y, 120, 60, text, color);
            blocks.push(block);
            render();
        }
        
        // Удаление выбранного блока
        function deleteSelected() {
            if (selectedBlock) {
                blocks = blocks.filter(block => block !== selectedBlock);
                selectedBlock = null;
                render();
            }
        }
        
        // Очистка всех блоков
        function clearAll() {
            blocks = [];
            selectedBlock = null;
            render();
        }
        
        // Увеличение размера выбранного блока
        function increaseSize() {
            if (selectedBlock) {
                selectedBlock.width += 20;
                selectedBlock.height += 10;
                render();
            }
        }
        
        // Уменьшение размера выбранного блока
        function decreaseSize() {
            if (selectedBlock && selectedBlock.width > 40 && selectedBlock.height > 30) {
                selectedBlock.width -= 20;
                selectedBlock.height -= 10;
                render();
            }
        }
        
        // Обновление текста выбранного блока
        function updateSelectedText() {
            if (selectedBlock) {
                const newText = document.getElementById('blockText').value;
                selectedBlock.text = newText;
                render();
            }
        }
        
        // Поиск блока по координатам
        function findBlockAt(x, y) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                if (blocks[i].containsPoint(x, y)) {
                    return blocks[i];
                }
            }
            return null;
        }
        
        // Обработчики событий мыши
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const mode = document.getElementById('modeSelect').value;
            
            if (mode === 'add') {
                // Режим добавления
                const color = document.getElementById('blockColor').value;
                const text = document.getElementById('blockText').value;
                const block = new Block(x - 60, y - 30, 120, 60, text, color);
                blocks.push(block);
                render();
            } else if (mode === 'select') {
                // Режим выделения/перемещения
                const block = findBlockAt(x, y);
                
                if (block) {
                    selectedBlock = block;
                    
                    // Проверяем, не хотим ли мы изменить размер
                    const direction = block.getResizeDirection(x, y);
                    if (direction) {
                        isResizing = true;
                        resizeDirection = direction;
                    } else {
                        isDragging = true;
                        dragOffsetX = x - block.x;
                        dragOffsetY = y - block.y;
                    }
                    
                    render();
                } else {
                    selectedBlock = null;
                    render();
                }
            } else if (mode === 'resize' && selectedBlock) {
                // Режим изменения размера
                isResizing = true;
                resizeDirection = 'se';
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!selectedBlock) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (isDragging) {
                // Перемещение блока
                selectedBlock.x = Math.max(0, Math.min(x - dragOffsetX, canvas.clientWidth - selectedBlock.width));
                selectedBlock.y = Math.max(0, Math.min(y - dragOffsetY, canvas.clientHeight - selectedBlock.height));
                render();
            } else if (isResizing) {
                // Изменение размера
                const newWidth = Math.max(60, x - selectedBlock.x);
                const newHeight = Math.max(40, y - selectedBlock.y);
                
                selectedBlock.width = Math.min(newWidth, canvas.clientWidth - selectedBlock.x);
                selectedBlock.height = Math.min(newHeight, canvas.clientHeight - selectedBlock.y);
                render();
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            isResizing = false;
        });
        
        // Добавляем несколько блоков для примера
        window.onload = () => {
            blocks.push(new Block(100, 100, 120, 60, 'Начало', '#90EE90'));
            blocks.push(new Block(300, 200, 120, 60, 'Процесс', '#87CEEB'));
            blocks.push(new Block(500, 300, 120, 60, 'Решение', '#FFB6C1'));
            render();
        };
    </script>
</body>
</html>
